name: Update formula

# Keeps every formula here in sync with its project's latest release.
# Uses only the repo's own GITHUB_TOKEN (reads the public release, writes here),
# so there is no cross-repo PAT to manage. Run it on demand from the Actions tab
# right after a release, or let the daily schedule pick it up.
on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync formulae to their latest releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/update.py

      - name: Commit if changed
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for formula in $(git diff --name-only); do
            name=$(basename "$formula" .rb)
            version=$(grep -oE 'version "[^"]+"' "$formula" | head -1 | sed -E 's/version "([^"]+)"/\1/')
            git add "$formula"
            git commit -m "Update $name to v$version"
          done
          git push
